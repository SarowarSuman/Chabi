<svg xmlns="http://www.w3.org/2000/svg" width="560" height="156" viewBox="0 0 560 156" role="img" aria-label="Open the Chabi live demo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#0a4d47"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f1f5f9"/><stop offset=".5" stop-color="#a7b4c6"/><stop offset="1" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#ffffff" stop-opacity=".38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="drop" x="-10%" y="-20%" width="120%" height="170%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity=".45"/>
    </filter>
    <clipPath id="face"><rect x="20" y="14" width="520" height="104" rx="26"/></clipPath>
  </defs>
  <style>
    .key{animation:bob 3.2s ease-in-out infinite;transform-origin:66px 66px}
    @keyframes bob{50%{transform:translateY(-4px) rotate(-7deg)}}
    .sweep{animation:sweep 3.8s ease-in-out infinite}
    @keyframes sweep{0%,55%{transform:translateX(-160px)}100%{transform:translateX(640px)}}
    text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  </style>

  <!-- 3D slab: dark thickness under the face -->
  <g filter="url(#drop)">
    <rect x="20" y="26" width="520" height="104" rx="26" fill="url(#side)"/>
    <rect x="20" y="14" width="520" height="104" rx="26" fill="url(#top)"/>
  </g>
  <!-- top gloss + moving shine -->
  <rect x="22" y="16" width="516" height="48" rx="24" fill="#ffffff" opacity=".14"/>
  <g clip-path="url(#face)"><g transform="skewX(-20)"><rect class="sweep" x="0" y="14" width="80" height="104" fill="url(#shine)"/></g></g>

  <!-- key icon -->
  <g class="key">
    <circle cx="66" cy="66" r="21" fill="url(#steel)" stroke="#475569" stroke-width="1.5"/>
    <circle cx="66" cy="66" r="7.5" fill="#0f766e"/>
    <path d="M85 60H170V67H162V74H153V67H145V78H135V67H126V73H116V67H106V76H96V67H85Z" fill="url(#steel)" stroke="#475569" stroke-width="1.5" stroke-linejoin="round"/>
  </g>

  <!-- label -->
  <text x="204" y="68" font-size="31" font-weight="800" fill="#04201c" letter-spacing="-.5">Open live demo</text>
  <text x="205" y="93" font-size="15" font-weight="600" fill="#0b3b36" opacity=".85">sarowarsuman.github.io/Chabi</text>

  <!-- arrow chip -->
  <circle cx="498" cy="66" r="23" fill="#04201c" opacity=".92"/>
  <path d="M489 66H506M499 57L508 66L499 75" fill="none" stroke="#5eead4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
